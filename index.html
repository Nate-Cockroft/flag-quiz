<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="menu">

    <h1>🌍 Flag Quiz</h1>

    <p class="subtitle">
        Learn flags while competing for the highest score.
    </p>

    <div class="stats">

        <div class="card">
            <h2 id="questionCount">Loading...</h2>
            <span>Questions</span>
        </div>

        <div class="card">
            <h2 id="bestScore">0</h2>
            <span>Best Score</span>
        </div>

        <div class="card">
            <h2 id="bestStreak">0</h2>
            <span>Best Streak</span>
        </div>

    </div>

    <button class="playButton" onclick="location.href='quiz.html'">
        ▶ PLAY
    </button>

    <div class="tagFilters" id="tagFilters">
        <span class="tagFiltersTitle">Include:</span>
    </div>

    <div class="menuButtons">

        <button onclick="location.href='browse.html'">
            🔍 Browse Flags
        </button>

        <button onclick="location.href='about.html'">
            ℹ About
        </button>

</div>

    <script>
     if("serviceWorker" in navigator){
         navigator.serviceWorker.register("/sw.js");
     }
    </script>

    <script>
     const bestScore = localStorage.getItem("bestScore") || 0;
     const bestStreak = localStorage.getItem("bestStreak") || 0;

     document.getElementById("bestScore").textContent = bestScore;
     document.getElementById("bestStreak").textContent = bestStreak;

     const EXCLUDED_KEY = "excludedTags";

     function loadExcludedTags(){
         try {
             return JSON.parse(localStorage.getItem(EXCLUDED_KEY)) || [];
         } catch(error) {
             return [];
         }
     }

     function saveExcludedTags(list){
         localStorage.setItem(EXCLUDED_KEY, JSON.stringify(list));
     }

     let rows = [];

     function countFiltered(){
         const excluded = loadExcludedTags();
         let n = 0;
         for(let i = 1; i < rows.length; i++){
             const cols = rows[i].split("\t");
             const tags = cols[7] ? cols[7].split(",").map(t => t.trim()).filter(Boolean) : [];
             if(tags.length === 0 || !tags.some(t => excluded.includes(t))) n++;
         }
         return n;
     }

     fetch("questions.csv")
     .then(r => r.text())
     .then(text => {
         rows = text.trim().split(/\r?\n/);
         document.getElementById("questionCount").textContent = countFiltered();
         buildTagFilters();
     });

     function buildTagFilters(){
         const container = document.getElementById("tagFilters");
         const tagList = [];
         for(let i = 1; i < rows.length; i++){
             const cols = rows[i].split("\t");
             if(!cols[7]) continue;
             cols[7].split(",").forEach(t => {
                 t = t.trim();
                 if(t && !tagList.includes(t)) tagList.push(t);
             });
         }
         tagList.sort();
         const excluded = loadExcludedTags();
         tagList.forEach(tag => {
             const label = document.createElement("label");
             const cb = document.createElement("input");
             cb.type = "checkbox";
             cb.checked = !excluded.includes(tag);
             cb.addEventListener("change", () => {
                 const list = loadExcludedTags();
                 const idx = list.indexOf(tag);
                 if(cb.checked && idx > -1) list.splice(idx, 1);
                 if(!cb.checked && idx === -1) list.push(tag);
                 saveExcludedTags(list);
                 label.classList.toggle("checked", cb.checked);
                 document.getElementById("questionCount").textContent = countFiltered();
             });
             label.appendChild(cb);
             label.appendChild(document.createTextNode(" " + tag));
             label.classList.toggle("checked", cb.checked);
             container.appendChild(label);
         });
     }
    </script>

    </body>
    </html>
