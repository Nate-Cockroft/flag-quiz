<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="menu">

    <h1>🌍 Flag Quiz</h1>

    <p class="subtitle">
        Learn flags while competing for the highest score.
    </p>

    <div class="stats">

        <div class="card">
            <h2 id="questionCount">Loading...</h2>
            <span>Questions</span>
        </div>

        <div class="card">
            <h2 id="bestScore">0</h2>
            <span>Best Score</span>
        </div>

        <div class="card">
            <h2 id="bestStreak">0</h2>
            <span>Best Streak</span>
        </div>

    </div>

    <button class="playButton" onclick="location.href='quiz.html'">
        ▶ PLAY
    </button>

    <div class="modeFilterWrap">

        <button
            class="tagButton"
            id="modeButton"
            onclick="toggleModeModal()"
        >
            🎮 Game Mode:
            <span id="modeCount"></span>
        </button>

        <div
            class="tagModal"
            id="modeModal"
            hidden
        >

            <div class="tagModalCard">

                <div class="tagModalHeader">

                    <span>Select Game Mode</span>

                    <button
                        class="tagModalClose"
                        onclick="closeModeModal()"
                    >
                        ✕
                    </button>

                </div>

                <div
                    class="tagModalBody"
                    id="modeModalBody"
                >

                    <div
                        class="modeGrid"
                        id="modeGrid"
                    ></div>

                </div>

                <div class="tagModalFooter">

                    <button
                        class="tagModalReset"
                        onclick="closeModeModal()"
                    >
                        Done
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="modifierFilterWrap">

        <button
            class="tagButton"
            id="modifierButton"
            onclick="toggleModifierModal()"
        >
            ✨ Modifiers:
            <span id="modifierScore">×1.0</span>
        </button>

        <div
            class="tagModal"
            id="modifierModal"
            hidden
        >

            <div class="tagModalCard">

                <div class="tagModalHeader">

                    <span>Select Modifiers</span>

                    <button
                        class="tagModalClose"
                        onclick="closeModifierModal()"
                    >
                        ✕
                    </button>

                </div>

                <div
                    class="tagModalBody"
                    id="modifierModalBody"
                >

                    <div
                        class="modifierGrid"
                        id="modifierGrid"
                    ></div>

                </div>

                <div class="tagModalFooter">

                    <button
                        class="tagModalReset"
                        onclick="closeModifierModal()"
                    >
                        Done
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="tagFilterWrap">

        <button
            class="tagButton"
            id="tagButton"
            onclick="toggleTagModal()"
        >
            🏷 Filter Tags
        </button>

        <div
            class="tagModal"
            id="tagModal"
            hidden
        >

            <div class="tagModalCard">

                <div class="tagModalHeader">

                    <span>Filter Flags</span>

                    <button
                        class="tagModalClose"
                        onclick="closeTagModal()"
                    >
                        ✕
                    </button>

                </div>

                <div
                    class="tagModalBody"
                    id="tagModalBody"
                ></div>

                <div class="tagModalFooter">

                    <button
                        class="tagModalReset"
                        onclick="resetTagFilters()"
                    >
                        Reset
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div class="menuButtons">

        <button onclick="location.href='browse.html'">
            🔍 Browse Flags
        </button>

</div>

    <script>
     if("serviceWorker" in navigator){
         navigator.serviceWorker.register("/sw.js");
     }
    </script>

    <script src="./data.js"></script>

    <script src="./modes.js"></script>

    <script src="./modifiers.js"></script>

    <script>
     const bestScore = localStorage.getItem("bestScore") || 0;
     const bestStreak = localStorage.getItem("bestStreak") || 0;

     document.getElementById("bestScore").textContent = bestScore;
     document.getElementById("bestStreak").textContent = bestStreak;

      const TAG_GROUPS = [
         {
             name: "Type",
             tags: ["flag", "country", "city", "province", "state", "island", "territory", "alliance", "border", "other"]
         },
         {
             name: "Continent",
             tags: ["africa", "antarctica", "asia", "europe", "north-america", "oceania", "south-america"]
         },
         {
             name: "Time period",
             tags: ["medieval", "14th-century", "17th-century", "18th-century", "19th-century", "20th-century", "modern"]
         }
     ];

     const MODE_DEFS = [
         {
             id: "classic",
             name: "Classic",
             icon: "🏆",
             desc: "5 lives, streak multiplier, endless flags."
         },
         {
             id: "casual",
             name: "Casual",
             icon: "🌿",
             desc: "No lives, no pressure. Just keep going."
         },
         {
             id: "hard",
             name: "Hard",
             icon: "💀",
             desc: "8 options instead of 4."
         },
         {
             id: "reverse",
             name: "Reverse",
             icon: "🔁",
             desc: "See the name, pick the flag."
         },
         {
             id: "daily",
             name: "Daily Flag",
             icon: "📅",
             desc: "One flag everyone gets each day."
         },
         {
             id: "twoPlayer",
             name: "Two Player",
             icon: "👥",
             desc: "Pass and play with a friend."
         }
     ];

     function buildModeSelector(){
         const grid = document.getElementById("modeGrid");
         const selected = loadMode();
         grid.innerHTML = "";
         MODE_DEFS.forEach(def => {
             const card = document.createElement("button");
             card.className = "modeCard" + (def.id === selected ? " selected" : "");
             card.onclick = () => {
                 saveMode(def.id);
                 document.querySelectorAll(".modeCard").forEach(c => c.classList.remove("selected"));
                 card.classList.add("selected");
                 updateModeCount();
                 closeModeModal();
             };
             const icon = document.createElement("span");
             icon.className = "modeIcon";
             icon.textContent = def.icon;
             const name = document.createElement("span");
             name.className = "modeName";
             name.textContent = def.name;
             const desc = document.createElement("span");
             desc.className = "modeDesc";
             desc.textContent = def.desc;
             card.appendChild(icon);
             card.appendChild(name);
             card.appendChild(desc);
             grid.appendChild(card);
         });
     }

     function toggleModeModal(){
         const modal = document.getElementById("modeModal");
         modal.hidden = !modal.hidden;
     }

     function closeModeModal(){
         document.getElementById("modeModal").hidden = true;
     }

     function buildModifierSelector(){
         const grid = document.getElementById("modifierGrid");
         const active = loadModifiers();
         grid.innerHTML = "";
         MODIFIER_DEFS.forEach(def => {
             const chip = document.createElement("button");
             chip.className = "modifierChip" + (active.includes(def.id) ? " active" : "");
             const icon = document.createElement("span");
             icon.className = "modifierIcon";
             icon.textContent = def.icon;
             const name = document.createElement("span");
             name.className = "modifierName";
             name.textContent = def.name;
             const mult = document.createElement("span");
             mult.className = "modifierMult";
             mult.textContent = "×" + def.multiplier;
             chip.appendChild(icon);
             chip.appendChild(name);
             chip.appendChild(mult);
             chip.onclick = () => {
                 const list = loadModifiers();
                 const idx = list.indexOf(def.id);
                 if(idx > -1) list.splice(idx, 1);
                 else list.push(def.id);
                 saveModifiers(list);
                 buildModifierSelector();
                 updateModifierScore();
             };
             grid.appendChild(chip);
         });
     }

     function toggleModifierModal(){
         const modal = document.getElementById("modifierModal");
         modal.hidden = !modal.hidden;
     }

     function closeModifierModal(){
         document.getElementById("modifierModal").hidden = true;
     }

     function updateModifierScore(){
         const el = document.getElementById("modifierScore");
         if(el) el.textContent = "×" + getModifierMultiplier();
     }

     let questions = [];

     function countFiltered(){
         const excluded = loadExcludedTags();
         return questions.filter(q => {
             const tags = q.tags;
             return tags.length === 0 || !tags.some(t => excluded.includes(t));
         }).length;
     }

     loadQuestionsData()
     .then(list => {
         questions = list;
         document.getElementById("questionCount").textContent = countFiltered();
         buildTagModal();
         buildModeSelector();
         buildModifierSelector();
         updateModifierScore();
         updateModeCount();
     })
     .catch(() => {
         document.getElementById("questionCount").textContent = "—";
     });

     function updateModeCount(){
         const mode = loadMode();
         const def = MODE_DEFS.find(d => d.id === mode);
         const el = document.getElementById("modeCount");
         if(el && def) el.textContent = def.icon + " " + def.name;
     }

     function buildTagModal(){
         const body = document.getElementById("tagModalBody");
         const excluded = loadExcludedTags();
         body.innerHTML = "";
         TAG_GROUPS.forEach(group => {
             const section = document.createElement("div");
             section.className = "tagGroup";
             const title = document.createElement("div");
             title.className = "tagGroupTitle";
             title.textContent = group.name;
             section.appendChild(title);
             group.tags.forEach(tag => {
                 const label = document.createElement("label");
                 const cb = document.createElement("input");
                 cb.type = "checkbox";
                 cb.checked = !excluded.includes(tag);
                 cb.addEventListener("change", () => {
                     const list = loadExcludedTags();
                     const idx = list.indexOf(tag);
                     if(cb.checked && idx > -1) list.splice(idx, 1);
                     if(!cb.checked && idx === -1) list.push(tag);
                     saveExcludedTags(list);
                     label.classList.toggle("checked", cb.checked);
                     document.getElementById("questionCount").textContent = countFiltered();
                 });
                 label.appendChild(cb);
                 label.appendChild(document.createTextNode(" " + tag));
                 label.classList.toggle("checked", cb.checked);
                 section.appendChild(label);
             });
             body.appendChild(section);
         });
     }

     function toggleTagModal(){
         const modal = document.getElementById("tagModal");
         modal.hidden = !modal.hidden;
     }

     function closeTagModal(){
         document.getElementById("tagModal").hidden = true;
     }

     function resetTagFilters(){
         saveExcludedTags([...DEFAULT_EXCLUDED_TAGS]);
         buildTagModal();
         document.getElementById("questionCount").textContent = countFiltered();
     }
    </script>

    </body>
    </html>
