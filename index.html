<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="menu">

    <h1>🌍 Flag Quiz</h1>

    <p class="subtitle">
        Learn flags while competing for the highest score.
    </p>

    <div class="stats">

        <div class="card">
            <h2 id="questionCount">Loading...</h2>
            <span>Questions</span>
        </div>

        <div class="card">
            <h2 id="bestScore">0</h2>
            <span>Best Score</span>
        </div>

        <div class="card">
            <h2 id="bestStreak">0</h2>
            <span>Best Streak</span>
        </div>

    </div>

    <button class="playButton" onclick="location.href='quiz.html'">
        ▶ PLAY
    </button>

    <div class="menuButtons">

        <button onclick="location.href='leaderboard.html'">
            🏆 Leaderboard
        </button>

        <button onclick="location.href='browse.html'">
            🔍 Browse Flags
        </button>

        <button onclick="location.href='add-question.html'">
            ➕ Add Question
        </button>

        <button onclick="location.href='about.html'">
            ℹ About
        </button>

    </div>

    <div class="leaderboardSection" id="leaderboardSection">

        <h3>🏆 Top Scores</h3>

        <div id="leaderboardList">

            <p>Loading...</p>

        </div>

    </div>

</div>

<script>
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js");
}
</script>

<script src="./leaderboard.js"></script>

<script>

const bestScore = localStorage.getItem("bestScore") || 0;
const bestStreak = localStorage.getItem("bestStreak") || 0;

document.getElementById("bestScore").textContent = bestScore;
document.getElementById("bestStreak").textContent = bestStreak;

fetch("questions.csv")
.then(r=>r.text())
.then(text=>{

    const rows = text.trim().split("\n");

    document.getElementById("questionCount").textContent =
        rows.length-1;

});

getLeaderboard(10).then(entries => {

    const list = document.getElementById("leaderboardList");

    if (!list) return;

    if (entries.length === 0) {

        list.innerHTML = "<p>No scores yet. Be the first!</p>";

        return;

    }

    list.innerHTML = entries.map((e, i) =>

        `<div class="leaderboardEntry">

            <span class="rank">#${i + 1}</span>

            <span class="lbName">${e.name}</span>

            <span class="lbScore">${e.score}</span>

            <span class="lbStreak">🔥 ${e.streak}</span>

        </div>`

    ).join("");

});

</script>

</body>
</html>
