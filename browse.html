<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Flags - Flag Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="quizContainer">

    <button onclick="location.href='index.html'" class="backButton">
        ← Back
    </button>

    <h1>🔍 Browse Flags</h1>

    <div class="browseFilters">

        <input type="text" id="searchInput" placeholder="Search flags..." class="searchInput">

        <select id="tagSelect" class="searchInput">
            <option value="">All tags</option>
        </select>

        <button id="clearFilters" class="clearButton">Clear</button>

    </div>

    <div id="flagList" class="flagList">

        <p>Loading flags...</p>

    </div>

    <button onclick="location.href='index.html'" class="backButton">
        ← Back
    </button>

    <button onclick="location.href='index.html'" class="playAgain">
        Menu
    </button>

</div>

<script>
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js");
}
</script>

<script src="./data.js"></script>
<script src="./browse.js"></script>

</body>
</html>
