<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question - Flag Quiz</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .adminLayout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .aiPanel {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
            background: #1b1b1b;
            border-radius: 14px;
            padding: 15px;
        }
        .aiPanel h3 {
            margin: 0 0 10px;
            font-size: 1rem;
        }
        .aiPanel textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #333;
            color: white;
            font-size: .9rem;
            resize: vertical;
            min-height: 80px;
            margin-bottom: 10px;
        }
        .aiPanel textarea::placeholder {
            color: #888;
        }
        .aiPanel button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #2a5;
            color: white;
            font-size: .95rem;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .aiPanel button:hover {
            background: #285;
        }
        .aiPanel button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .aiStatus {
            margin-top: 8px;
            font-size: .85rem;
            color: #aaa;
            min-height: 20px;
        }
        .aiResult {
            margin-top: 10px;
            padding: 10px;
            background: #222;
            border-radius: 10px;
            font-size: .85rem;
            display: none;
        }
        .aiResult pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .formPanel {
            flex: 2;
            min-width: 300px;
        }
        @media(max-width: 700px) {
            .adminLayout {
                flex-direction: column;
            }
            .aiPanel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="background"></div>

<div class="quizContainer">

    <button onclick="location.href='index.html'" class="backButton">
        ← Back
    </button>

    <h1>➕ Add Question</h1>

    <div id="adminSection">

        <div id="passwordPrompt">
            <p>Enter admin password to add questions:</p>
            <input type="password" id="adminPassword" placeholder="Password" class="searchInput">
            <button onclick="checkPassword()" class="playButton">Unlock</button>
            <p id="passwordError" style="color:red;display:none;">Wrong password.</p>
        </div>

        <div id="questionForm" style="display:none;">

            <div class="adminLayout">

                <div class="aiPanel">
                    <h3>🤖 AI Assistant</h3>
                    <textarea id="aiPrompt" placeholder="Ask for country names... e.g. 'Give me 3 communist country flags'"></textarea>
                    <button onclick="askAI()" id="aiAskBtn">Ask AI</button>
                    <button onclick="generateWithAI()" id="aiGenBtn" style="background:#2a5;">AI Generate Question</button>
                    <div class="aiStatus" id="aiStatus"></div>
                    <div class="aiResult" id="aiResult">
                        <pre id="aiResultText"></pre>
                    </div>
                </div>

                <div class="formPanel">
                    <label>Flag Image URL:</label>
                    <input type="text" id="flagUrl" placeholder="https://example.com/flag.png" class="searchInput">

                    <label>Question Text:</label>
                    <input type="text" id="questionText" placeholder="What country is this?" class="searchInput">

                    <label>Option 1:</label>
                    <input type="text" id="opt1" placeholder="Answer 1" class="searchInput">

                    <label>Option 2:</label>
                    <input type="text" id="opt2" placeholder="Answer 2" class="searchInput">

                    <label>Option 3:</label>
                    <input type="text" id="opt3" placeholder="Answer 3" class="searchInput">

                    <label>Option 4:</label>
                    <input type="text" id="opt4" placeholder="Answer 4" class="searchInput">

                    <label>Correct Answer (1-4):</label>
                    <input type="number" id="correctAnswer" min="1" max="4" placeholder="1" class="searchInput">

                    <button onclick="generateCsvLine()" class="playButton">Generate CSV Line</button>

                    <div id="csvOutput" style="display:none; margin-top:15px;">
                        <label>Copy this line to questions.csv:</label>
                        <textarea id="csvLine" rows="2" readonly style="width:100%;padding:10px;border-radius:12px;border:none;background:#333;color:white;font-size:.9rem;"></textarea>
                        <button onclick="copyCsvLine()" class="playAgain">Copy to Clipboard</button>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script>
const ADMIN_PASSWORD = "flagquiz2026";

function checkPassword() {
    const pw = document.getElementById("adminPassword").value;
    if (pw === ADMIN_PASSWORD) {
        document.getElementById("passwordPrompt").style.display = "none";
        document.getElementById("questionForm").style.display = "block";
        document.getElementById("passwordError").style.display = "none";
    } else {
        document.getElementById("passwordError").style.display = "block";
    }
}

function generateCsvLine() {
    const url = document.getElementById("flagUrl").value.trim();
    const question = document.getElementById("questionText").value.trim();
    const opt1 = document.getElementById("opt1").value.trim();
    const opt2 = document.getElementById("opt2").value.trim();
    const opt3 = document.getElementById("opt3").value.trim();
    const opt4 = document.getElementById("opt4").value.trim();
    const correct = document.getElementById("correctAnswer").value.trim();

    if (!url || !question || !opt1 || !opt2 || !opt3 || !opt4 || !correct) {
        alert("All fields are required.");
        return;
    }

    const correctNum = parseInt(correct);
    if (isNaN(correctNum) || correctNum < 1 || correctNum > 4) {
        alert("Correct answer must be a number between 1 and 4.");
        return;
    }

    const csvLine = question + "\t" + url + "\t" + opt1 + "\t" + opt2 + "\t" + opt3 + "\t" + opt4 + "\t" + correctNum;
    document.getElementById("csvLine").value = csvLine;
    document.getElementById("csvOutput").style.display = "block";
}

function copyCsvLine() {
    const textarea = document.getElementById("csvLine");
    textarea.select();
    document.execCommand("copy");
    alert("Copied to clipboard!");
}

async function callLMStudio(messages) {
    const status = document.getElementById("aiStatus");
    const btn = document.getElementById("aiAskBtn");
    const genBtn = document.getElementById("aiGenBtn");

    status.textContent = "Querying LM Studio...";
    status.style.color = "#ff6";
    btn.disabled = true;
    genBtn.disabled = true;

    const payload = {
        model: "local-model",
        messages: messages,
        temperature: 0.7,
        max_tokens: 1000
    };

    try {
        const response = await fetch("http://localhost:1234/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        const content = data.choices[0].message.content;

        status.textContent = "Ready.";
        status.style.color = "#4f4";

        return content;

    } catch (err) {
        status.textContent = "Error: " + err.message + ". Is LM Studio running on localhost:1234?";
        status.style.color = "#f44";
        return null;
    } finally {
        btn.disabled = false;
        genBtn.disabled = false;
    }
}

async function askAI() {
    const prompt = document.getElementById("aiPrompt").value.trim();
    if (!prompt) {
        alert("Enter a question for the AI first.");
        return;
    }

    const resultDiv = document.getElementById("aiResult");
    const resultText = document.getElementById("aiResultText");
    resultDiv.style.display = "block";
    resultText.textContent = "Thinking...";

    const systemMsg = "You are a helpful assistant for a flag quiz game. You help generate country names, flag descriptions, and quiz content. Respond with useful, concise information.";

    const content = await callLMStudio([
        { role: "system", content: systemMsg },
        { role: "user", content: prompt }
    ]);

    if (content) {
        resultText.textContent = content;
    }
}

async function generateWithAI() {
    const imageUrl = document.getElementById("flagUrl").value.trim();
    const countryName = document.getElementById("questionText").value.trim();

    if (!imageUrl) {
        alert("Please enter the flag image URL first.");
        return;
    }

    const status = document.getElementById("aiStatus");
    const resultDiv = document.getElementById("aiResult");
    const resultText = document.getElementById("aiResultText");
    resultDiv.style.display = "block";
    resultText.textContent = "Generating question...";

    const systemMsg = "You are a flag quiz question generator. Given a flag image URL and a country name, generate a multiple-choice question with 4 options. Return ONLY a valid JSON object with these keys: question (string), options (array of exactly 4 strings), correct_index (number 1-4). The question should be 'What country is this?' or similar. The options should include the correct country name and 3 plausible distractors. Do not include any text outside the JSON.";

    const content = await callLMStudio([
        { role: "system", content: systemMsg },
        { role: "user", content: "Flag image URL: " + imageUrl + "\nCountry name: " + countryName + "\n\nGenerate a quiz question in JSON format." }
    ]);

    if (!content) return;

    try {
        let jsonStr = content;
        const jsonStart = content.indexOf("{");
        const jsonEnd = content.lastIndexOf("}") + 1;
        if (jsonStart !== -1 && jsonEnd > jsonStart) {
            jsonStr = content.substring(jsonStart, jsonEnd);
        }

        const result = JSON.parse(jsonStr);

        document.getElementById("questionText").value = result.question || "What country is this?";
        document.getElementById("opt1").value = result.options[0] || "";
        document.getElementById("opt2").value = result.options[1] || "";
        document.getElementById("opt3").value = result.options[2] || "";
        document.getElementById("opt4").value = result.options[3] || "";
        document.getElementById("correctAnswer").value = result.correct_index || 1;

        resultText.textContent = "Generated! Check the form fields.";
        status.textContent = "AI generated! Review and save.";
        status.style.color = "#4f4";

    } catch (err) {
        resultText.textContent = "Failed to parse AI response. Raw output:\n\n" + content;
        status.textContent = "Parse error.";
        status.style.color = "#f44";
    }
}
</script>

</body>
</html>
